name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: --health-cmd "mongosh --eval \"db.adminCommand('ping')\"" --health-interval 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Lint
        run: pip install ruff && ruff check backend/
      - name: Test
        env:
          MONGODB_URL: mongodb://localhost:27017
          MONGODB_DB: tutordb_test
          GOOGLE_API_KEY: AIzaSy_test_dummy_key_for_ci_only
          SECRET_KEY: test-secret-key-for-ci-minimum-32-chars
        run: |
          pip install pytest httpx
          pytest backend/tests/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
